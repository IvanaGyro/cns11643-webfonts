repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pyproject-fmt
        name: pyproject-fmt
        entry: pyproject-fmt
        language: system
        files: pyproject\.toml$


