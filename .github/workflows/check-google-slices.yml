name: Check Google Slicing Updates

on:
  schedule:
    # Run weekly on Mondays at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PYTHONPATH: src

jobs:
  check-slices:
    name: Check googlefonts/nam-files for TC Slicing Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          cache: true

      - name: Check for upstream strategy update
        id: check_update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pixi run python -m cns_webfont.cli check-google-slices

      - name: Create Pull Request if updated
        if: ${{ hashFiles('PR_BODY.md') != '' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): update Google Fonts Traditional Chinese slicing strategy"
          title: "chore(data): update Google Fonts TC slicing strategy"
          body-path: PR_BODY.md
          branch: chore/google-slices-update
          base: main
          labels: dependencies, automated-pr

