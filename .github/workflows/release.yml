name: Release CNS11643 Web Fonts

on:
  schedule:
    # Run weekly on Mondays at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build and publish even if version matches npm'
        required: false
        default: false
        type: boolean
      recipe_revision:
        description: 'Recipe revision integer (e.g. 0, 1, 2, or auto)'
        required: false
        default: 'auto'
        type: string

concurrency:
  group: cns-webfont-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PYTHONPATH: src
  NPM_SCPOE: ${{ secrets.NPM_SCPOE || vars.NPM_SCPOE || '' }}
  NPM_SCOPE: ${{ secrets.NPM_SCOPE || vars.NPM_SCOPE || secrets.NPM_SCPOE || vars.NPM_SCPOE || '@cns11643' }}

jobs:
  check-upstream:
    name: Check Upstream vs npm
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      revision: ${{ steps.check.outputs.revision }}
      needs_build: ${{ steps.check.outputs.needs_build }}
      scope: ${{ steps.check.outputs.scope }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          cache: true

      - name: Check upstream version vs npm registry
        id: check
        env:
          FORCE_BUILD: ${{ inputs.force_build || false }}
          RECIPE_REV: ${{ inputs.recipe_revision || 'auto' }}
        run: |
          ARGS=""
          if [ "$FORCE_BUILD" = "true" ]; then
            ARGS="--force-build"
          fi
          pixi run python -m cns_webfont.cli check-upstream \
            --github-output \
            --recipe-revision "$RECIPE_REV" \
            $ARGS

      - name: Report failure as GitHub Issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = `Automated CNS11643 check failed`;
            const issueBody = [
              '### Automated Upstream Check Failed',
              '',
              `- **Workflow Run**: [View Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `- **Event**: ${context.eventName}`,
              `- **Timestamp**: ${new Date().toISOString()}`,
              '',
              'Please inspect the run logs for details regarding upstream site availability or npm registry connectivity.'
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const existing = issues.data.find(i => i.title === issueTitle);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody
              });
            }

  build-and-publish:
    name: Build and Publish
    needs: check-upstream
    if: ${{ needs.check-upstream.outputs.needs_build == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Ensure modern npm CLI for Trusted Publishing
        run: npm install -g npm@latest

      - name: Configure npm authentication (Token vs Trusted Publishing)
        env:
          TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "::notice::NPM_TOKEN / NODE_AUTH_TOKEN is detected. Configuring token-based authentication..."
            echo "//registry.npmjs.org/:_authToken=${TOKEN}" > ~/.npmrc
          else
            echo "::notice::NPM_TOKEN is not set. Using OIDC Trusted Publishing without auth token..."
            rm -f ~/.npmrc
          fi

      - name: Download official font archives
        run: |
          pixi run python -m cns_webfont.cli download --output-dir sources

      - name: Build TW-Sung and TW-Kai packages
        run: |
          pixi run python -m cns_webfont.cli build-all \
            --sources-dir sources \
            --output-dir packages \
            --upstream-version ${{ needs.check-upstream.outputs.version }} \
            --recipe-revision ${{ needs.check-upstream.outputs.revision }} \
            --scope "${{ needs.check-upstream.outputs.scope }}" \
            --offline

      - name: Validate built packages
        run: |
          pixi run python -m cns_webfont.cli validate packages/tw-sung
          pixi run python -m cns_webfont.cli validate packages/tw-kai

      - name: Package size guard (npm pack dry-run)
        run: |
          echo "Checking unpacked package sizes..."
          cd packages/tw-sung && npm pack --dry-run && cd ../..
          cd packages/tw-kai && npm pack --dry-run && cd ../..

      - name: Setup Playwright browser testing
        run: |
          cd browser-tests
          npm ci || npm install
          npx playwright install --with-deps
          npx playwright test

      - name: Publish TW-Sung to npm
        run: |
          cd packages/tw-sung
          npm publish --access public --provenance
          cd ../..

      - name: Publish TW-Kai to npm
        run: |
          cd packages/tw-kai
          npm publish --access public --provenance
          cd ../..

      - name: Post-publish jsDelivr CDN smoke test
        run: |
          echo "Running post-publish smoke test on jsDelivr..."
          pixi run python -c "
          import time, requests, sys
          scope = '${{ needs.check-upstream.outputs.scope }}'
          version = '${{ needs.check-upstream.outputs.version }}.${{ needs.check-upstream.outputs.revision }}.0'
          urls = [
              f'https://cdn.jsdelivr.net/npm/{scope}/tw-sung@{version}/tw-sung.css',
              f'https://cdn.jsdelivr.net/npm/{scope}/tw-kai@{version}/tw-kai.css',
          ]
          for url in urls:
              print(f'Checking {url}...')
              for attempt in range(6):
                  try:
                      res = requests.get(url, timeout=10)
                      if res.status_code == 200:
                          print(f'  [OK] HTTP 200 (content-length: {len(res.content)})')
                          break
                  except Exception as e:
                      pass
                  time.sleep(15)
              else:
                  print(f'  [WARN] CDN propagation pending for {url}')
          "

      - name: Report failure as GitHub Issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = `Automated CNS11643 update failed: ${{ needs.check-upstream.outputs.version || 'unknown' }}`;
            const issueBody = [
              '### Automated Upstream Release Run Failed',
              '',
              `- **Upstream Version**: \`${{ needs.check-upstream.outputs.version || 'unknown' }}\``,
              `- **Workflow Run**: [View Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `- **Event**: ${context.eventName}`,
              `- **Timestamp**: ${new Date().toISOString()}`,
              '',
              'Please inspect the run logs for details regarding validation, regression gates, or network failures.'
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const existing = issues.data.find(i => i.title === issueTitle);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody
              });
            }

